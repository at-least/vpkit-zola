# The theme's own site: its demo and the pages its checks render. A docs
# site using the theme needs the [markdown] settings below (the templates
# refuse to build without them) and `theme = "vpkit-zola"`.
base_url = "https://at-least.github.io/vpkit-zola"
title = "vpkit-zola"
description = "VitePress's look for Zola docs sites, built on vpkit"
compile_sass = false
build_search_index = false

[markdown]
github_alerts = true
bottom_footnotes = true
insert_anchor_links = "right"
external_links_target_blank = true
external_links_no_referrer = true

[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

# The theme's settings (defaults in theme.toml, which Zola applies to sites
# that use the theme, not to this one).
[extra]
outline = 2
outline_label = "On this page"
sidebar_menu_label = "Menu"
return_to_top_label = "Return to top"
nav = [
  { text = "Parity", link = "@/parity/markdown.md", active_match = "^/parity/" },
]
social_links = [
  { icon = "github", link = "https://github.com/at-least/vpkit-zola" },
]
appearance = true
nav_menu_label = "Main Navigation"
extra_menu_label = "More options"
mobile_menu_label = "Menu"
dark_mode_switch_label = "Appearance"
dark_mode_switch_title = "Switch to dark theme"
light_mode_switch_title = "Switch to light theme"
edit_link = { pattern = "https://github.com/at-least/vpkit-zola/edit/main/content/:path", text = "Edit this page on GitHub" }
last_updated = true
last_updated_text = "Last updated"
doc_footer_prev = "Previous page"
doc_footer_next = "Next page"
footer = { message = "Released under the MIT License." }

[[extra.sidebar]]
text = "Introduction"
items = [
  { text = "vpkit-zola", link = "@/_index.md" },
]

[[extra.sidebar]]
text = "Parity"
collapsed = false
items = [
  { text = "Markdown Extensions", link = "@/parity/markdown.md" },
]
