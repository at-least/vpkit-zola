# A Zola site laid out as vitepress.dev's guide: its sidebar (VitePress's
# docs/config.ts sidebarGuide(), as deployed: the reference link sits in a
# section without a title) and its getting-started page's
# headings, so test/render.mjs can compare the theme's sidebar, local nav and
# aside with the site's, element by element. The theme comes from the
# repository: test/render.mjs links it in as themes/vpkit-zola.
base_url = "https://parity.test"
title = "VitePress"
theme = "vpkit-zola"
compile_sass = false
build_search_index = false

[markdown]
github_alerts = true
bottom_footnotes = true
insert_anchor_links = "right"

[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

[[extra.sidebar]]
text = "Introduction"
collapsed = false
items = [
  { text = "What is VitePress?", link = "/guide/what-is-vitepress/" },
  { text = "Getting Started", link = "@/guide/getting-started.md" },
  { text = "Routing", link = "/guide/routing/" },
  { text = "Deploy", link = "/guide/deploy/" },
]

[[extra.sidebar]]
text = "Writing"
collapsed = false
items = [
  { text = "Markdown Extensions", link = "/guide/markdown/" },
  { text = "Asset Handling", link = "/guide/asset-handling/" },
  { text = "Frontmatter", link = "/guide/frontmatter/" },
  { text = "Using Vue in Markdown", link = "/guide/using-vue/" },
  { text = "Internationalization", link = "/guide/i18n/" },
]

[[extra.sidebar]]
text = "Customization"
collapsed = false
items = [
  { text = "Using a Custom Theme", link = "/guide/custom-theme/" },
  { text = "Extending the Default Theme", link = "/guide/extending-default-theme/" },
  { text = "Build-Time Data Loading", link = "/guide/data-loading/" },
  { text = "SSR Compatibility", link = "/guide/ssr-compat/" },
  { text = "Connecting to a CMS", link = "/guide/cms/" },
]

[[extra.sidebar]]
text = "Experimental"
collapsed = false
items = [
  { text = "MPA Mode", link = "/guide/mpa-mode/" },
  { text = "Sitemap Generation", link = "/guide/sitemap-generation/" },
]

[[extra.sidebar]]
items = [
