# vpkit-zola's documentation, written for the theme it documents
# (README.md). zola serve here; base_url is where it would be published.
base_url = "http://127.0.0.1:1111"
title = "vpkit-zola"
description = "VitePress's look for Zola: a docs theme with no Node.js and no build step."
theme = "vpkit-zola"
compile_sass = false
build_search_index = false

[markdown]
github_alerts = true
bottom_footnotes = true
insert_anchor_links = "right"
external_links_target_blank = true
external_links_no_referrer = true
render_emoji = true

[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
logo = "/logo.svg"
nav = [
  { text = "Guide", link = "@/guide/what-is-vpkit-zola.md", active_match = "^/guide/" },
  { text = "Reference", link = "@/reference/settings.md", active_match = "^/reference/" },
  { text = "Links", items = [
    { text = "vpkit", link = "https://github.com/at-least/vpkit" },
    { text = "Changelog", link = "https://github.com/at-least/vpkit-zola/commits/main" },
    { text = "VitePress", link = "https://vitepress.dev" },
  ] },
]
social_links = [{ icon = "github", link = "https://github.com/at-least/vpkit-zola" }]
edit_link = { pattern = "https://github.com/at-least/vpkit-zola/edit/main/demo/content/:path", text = "Edit this page on GitHub" }
last_updated = true
footer = { message = "Released under the MIT License.", copyright = "Copyright © 2026-present newlix" }
outline = [2, 3]
search = true

[[extra.sidebar."/guide/"]]
text = "Introduction"
collapsed = false
items = [
  { text = "What is vpkit-zola?", link = "@/guide/what-is-vpkit-zola.md" },
  { text = "Getting Started", link = "@/guide/getting-started.md" },
]

[[extra.sidebar."/guide/"]]
text = "Writing"
collapsed = false
items = [
  { text = "Markdown", link = "@/guide/markdown.md" },
  { text = "Internationalization", link = "@/guide/i18n.md" },
  { text = "Coming from VitePress", link = "@/guide/coming-from-vitepress.md" },
]

[[extra.sidebar."/guide/"]]
items = [{ text = "Settings Reference", link = "@/reference/settings.md" }]

[[extra.sidebar."/reference/"]]
text = "Reference"
items = [
  { text = "Settings", link = "@/reference/settings.md" },
  { text = "Front Matter", link = "@/reference/front-matter.md" },
  { text = "Navbar", link = "@/reference/navbar.md" },
  { text = "Sidebar", link = "@/reference/sidebar.md" },
  { text = "Home Page", link = "@/reference/home-page.md" },
  { text = "Doc Footer", link = "@/reference/doc-footer.md" },
  { text = "Search", link = "@/reference/search.md" },
]
